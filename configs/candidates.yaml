# Baseline = what you already have: faster-whisper base.en on CTranslate2.
# `vary` changes ONE setting at a time from `base` so every difference has one cause.
defaults:
  repeats: 3
  warmup: 2
  sample_interval_s: 0.1
  cooldown_s: 15
  cooldown_max_temp_c: 70      # wait for the CPU to cool between candidates

targets:                       # pass/fail thresholds, set BEFORE looking at results
  rtf: 0.5
  # ttft_s: 0.3   # only meaningful in streaming mode; offline ttft == whole-clip latency
  wer_delta_pp: 1.0
  rss_mb: 1000
  max_hallucinated_words: 0

base:
  engine: faster_whisper
  model: models/faster-whisper-base.en
  compute_type: float32
  beam_size: 5
  threads: 4
  vad: false

vary:
  - compute_type: [int8, int8_float32]   # float16 is unsupported on this CPU
  - beam_size: [1, 2]
  - threads: [2, 8]
  - vad: [true]
  - model: [models/faster-whisper-tiny.en, models/faster-whisper-small.en, models/faster-whisper-distil-small.en]

# Explicit combinations (full candidates). Extra keys override base.
candidates:
  - {name: fw-base-int8-greedy,   compute_type: int8, beam_size: 1}
  - {name: fw-tiny-int8-greedy,   model: models/faster-whisper-tiny.en, compute_type: int8, beam_size: 1}
  - {name: fw-small-int8-greedy,  model: models/faster-whisper-small.en, compute_type: int8, beam_size: 1}
  - {name: cpp-base-f16-greedy,   engine: whisper_cpp, model: models/ggml-base.en.bin, beam_size: 1}
  - {name: cpp-base-q8-greedy,    engine: whisper_cpp, model: models/ggml-base.en-q8_0.bin, beam_size: 1}
  - {name: cpp-base-q5-greedy,    engine: whisper_cpp, model: models/ggml-base.en-q5_1.bin, beam_size: 1}
  - {name: cpp-base-q5-ctx768,    engine: whisper_cpp, model: models/ggml-base.en-q5_1.bin, beam_size: 1, audio_ctx: 768}
  - {name: cpp-small-q5-greedy,   engine: whisper_cpp, model: models/ggml-small.en-q5_1.bin, beam_size: 1}
